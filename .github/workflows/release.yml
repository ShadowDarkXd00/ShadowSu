name: Release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload ShadowSU.apk to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" ShadowSU.apk \
              --title "ShadowSU $TAG" \
              --notes "See repository README.md for details." \
              --target "$GITHUB_SHA"
          else
            gh release upload "$TAG" ShadowSU.apk --clobber
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
